# compose.yaml
services:
  frankenphp:
    build:
      context: ../../
      dockerfile: docker/franken/Dockerfile
    entrypoint: php artisan octane:frankenphp --workers=1 --max-requests=1 --host=0.0.0.0 --port=80
    ports:
      - "8002:80"
    environment:
      # APP_ENV: '${APP_ENV:-local}'
      # APP_DEBUG: '${APP_DEBUG:-true}'
      # APP_KEY: '${APP_KEY:-AUTO-GENERATE-IF-EMPTY-}'
      # DB_CONNECTION: '${DB_CONNECTION:-mysql}'
      # DB_HOST: '${DB_HOST:-mariadb}'
      # DB_PORT: '${DB_PORT:-3306}'
      # DB_DATABASE: '${DB_DATABASE:-evkin}'
      # DB_USERNAME: '${DB_USERNAME:-evkin_user}'
      # DB_PASSWORD: '${DB_PASSWORD:-secret}'
      APP_ENV: 'local'
      APP_DEBUG: 'true'
      # APP_KEY: 'AUTO-GENERATE-IF-EMPTY-'
      DB_CONNECTION: 'mariadb'
      DB_HOST: '192.168.1.55'
      DB_PORT: '3306'
      DB_DATABASE: 'evkin_dev'
      DB_USERNAME: 'dev'
      DB_PASSWORD: 'password'
      REDIS_PORT: '6380'
    networks:
      - evkin
    depends_on:
      - redis
  
  redis:
        image: 'redis:alpine'
        ports:
            # - '${FORWARD_REDIS_PORT:-6379}:6379'
            - '6380:6379'
        volumes:
            - 'evkin-redis:/data'
        networks:
            - evkin
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
networks:
    evkin:
        driver: bridge
volumes:
    evkin-redis:
        driver: local