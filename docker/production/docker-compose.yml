services:
  evkin:
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile
    image: evkin-builder:production
    depends_on:
      - redis
    ports:
      - "8082:80"
    network_mode: bridge
    env_file:
      - .env.production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - evkin_storage:/var/www/html/storage

  worker:
    image: evkin-builder:production
    depends_on:
      - evkin
      - redis
    command: ["sh", "-lc", "php artisan queue:work --tries=3 --timeout=90"]
    restart: unless-stopped
    network_mode: bridge
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - evkin_storage:/var/www/html/storage

  redis:
    image: 'redis:alpine'
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - 'evkin_redis:/data'
    network_mode: bridge
    healthcheck:
      test:
          - CMD
          - redis-cli
          - ping
      retries: 3
      timeout: 5s

volumes:
  evkin_storage:
  evkin_redis:
