services:
  app:
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile
    image: evkin-builder:production
    ports:
      - "8082:80"
    # environment:
    #   APP_ENV: production
    #   APP_DEBUG: "false"
    #   # Set this to your external URL in production
    #   APP_URL: http://localhost
    # Optionally load from a file instead of inlining:
    # (uncomment the next two lines and provide ../../.env)
    env_file:
      - .env.production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - app_storage:/var/www/html/storage

  worker:
    image: evkin-builder:production
    depends_on:
      - app
    command: ["sh", "-lc", "php artisan queue:work --tries=3 --timeout=90"]
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - app_storage:/var/www/html/storage

volumes:
  app_storage:
